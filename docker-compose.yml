services:
  # 1. PostgreSQL 15 Data Warehouse
  air-quality-dwh:
    image: postgres:15-alpine
    container_name: indo-air-quality-dwh
    restart: unless-stopped
    environment:
      POSTGRES_USER: aq_admin
      POSTGRES_PASSWORD: aq_secret_2026
      POSTGRES_DB: air_quality_dwh
    ports:
      - "5434:5432"
    volumes:
      - aq_pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aq_admin -d air_quality_dwh"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Apache Airflow Orchestrator (Webserver + Scheduler)
  airflow-aq:
    image: apache/airflow:2.9.3-python3.12
    container_name: indo-air-quality-airflow
    restart: unless-stopped
    depends_on:
      air-quality-dwh:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      DWH_HOST: air-quality-dwh
      DWH_PORT: "5432"
      DWH_DB: air_quality_dwh
      DWH_USER: aq_admin
      DWH_PASSWORD: aq_secret_2026
    ports:
      - "8086:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --firstname Admin --lastname AirQuality --role Admin --email admin@airquality.id --password admin || true &&
      airflow webserver --port 8080 & airflow scheduler"

volumes:
  aq_pgdata:
    driver: local